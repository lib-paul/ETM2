<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100" width="100%" height="100%">
  <!-- Monograma Oficial -->
  <g fill="#0B1D2D">
    <!-- Barra superior continua que une E y T -->
    <rect x="15" y="18" width="90" height="16" rx="2" />
    <!-- Pata izquierda (E) que va desde el tope hasta abajo -->
    <rect x="15" y="18" width="16" height="60" rx="2" />
    <!-- Barra central (E) -->
    <rect x="31" y="40" width="28" height="14" rx="1" />
    <!-- Barra inferior (E) -->
    <rect x="31" y="62" width="40" height="16" rx="2" />
    <!-- Pata derecha (T) centrada con respecto al ala del T (deja saliente a la derecha) -->
    <rect x="78" y="34" width="16" height="44" rx="2" />
  </g>
  
  <!-- Texto -->
  <text x="125" y="55" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-weight="800" font-size="36" fill="#0B1D2D" letter-spacing="0.5">ETCONSULTORES</text>
  <text x="127" y="78" font-family="'Lato', 'Helvetica Neue', sans-serif" font-weight="700" font-size="11" fill="#0F4C81" letter-spacing="3.5">
    INGENIERÍA <tspan fill="#22B5E5">•</tspan> HIDRÁULICA <tspan fill="#22B5E5">•</tspan> CONSTRUCCIÓN
  </text>
</svg>
